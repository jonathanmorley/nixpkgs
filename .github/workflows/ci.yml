name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lix
        shell: bash
        run: |
          curl -sSf -L https://install.lix.systems/lix -o /tmp/lix-install.sh
          sudo bash /tmp/lix-install.sh install --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - run: nix fmt -- --ci

  nix:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6 # v12
      - name: Install Lix
        shell: bash
        run: |
          curl -sSf -L https://install.lix.systems/lix -o /tmp/lix-install.sh
          sudo bash /tmp/lix-install.sh install --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: jonathanmorley
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check --print-build-logs --no-update-lock-file
      - run: nix build .#darwinConfigurations.gha-aarch64-darwin.config.system.build.toplevel
